[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kinetix-video"
version = "0.2.0"
description = "Declarative video compilation engine — write timelines in .ktx text, compile to .mp4"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Bruce Li" },
]
keywords = ["video", "timeline", "moviepy", "declarative", "compilation", "video-editing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Display",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = [
    "moviepy>=2.1.0",
    "numpy>=1.24",
    "Pillow>=10.0",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
template = ["jinja2>=3"]

[project.urls]
Homepage = "https://github.com/Bruce-lhq/kinetix"
Repository = "https://github.com/Bruce-lhq/kinetix"
Issues = "https://github.com/Bruce-lhq/kinetix/issues"

[project.scripts]
kinetix = "kinetix.cli:main"

[tool.setuptools.packages.find]
include = ["kinetix*"]
