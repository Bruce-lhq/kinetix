[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kinetix"
version = "0.2.0"
description = "Declarative video compilation engine — .ktx text files to .mp4"
requires-python = ">=3.10"
dependencies = [
    "moviepy>=2.1.0",
    "numpy>=1.24",
    "Pillow>=10.0",
    "matplotlib>=3.5",
]

[project.scripts]
kinetix = "kinetix.cli:main"

[tool.setuptools.packages.find]
include = ["kinetix*"]
